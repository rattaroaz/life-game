<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeSim</title>
    <style>
      html, body, #root {
        margin: 0;
        min-height: 100%;
        height: 100%;
        width: 100%;
        background: #0f0f1a;
        color: #eee;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #boot-status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        z-index: 0;
        pointer-events: none;
        color: #94a3b8;
      }
      #boot-status strong { color: #5eead4; font-size: 1.4rem; display: block; margin-bottom: 8px; }
      #boot-error {
        display: none;
        position: fixed;
        inset: 16px;
        z-index: 9999;
        background: #1e1b4b;
        border: 1px solid #f87171;
        border-radius: 12px;
        padding: 16px;
        overflow: auto;
        white-space: pre-wrap;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        color: #fecaca;
      }
    </style>
  </head>
  <body>
    <div id="boot-status">
      <div>
        <strong>LifeSim</strong>
        Loading…
      </div>
    </div>
    <div id="boot-error"></div>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (e) {
        var el = document.getElementById('boot-error');
        if (!el) return;
        el.style.display = 'block';
        el.textContent = 'Runtime error:\n' + (e.error && e.error.stack ? e.error.stack : e.message);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var el = document.getElementById('boot-error');
        if (!el) return;
        el.style.display = 'block';
        var r = e.reason;
        el.textContent = 'Unhandled promise:\n' + (r && r.stack ? r.stack : String(r));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
