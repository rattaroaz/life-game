[package]
name = "lifesim"
version = "0.1.0"
description = "LifeSim — life simulation desktop shell"
authors = ["LifeSim"]
edition = "2021"

[lib]
name = "lifesim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
